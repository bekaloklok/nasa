<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probe connection test</title>
<style>
  :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --line: #ddddd6; --ok: #2f7d32; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ededea; --muted: #9a9a94; --line: #33332f; --ok: #7bc47f; --bad: #f2867c; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; }
  button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--fg); color: var(--bg); font: inherit; cursor: pointer; }
  #status { font-weight: 600; margin-bottom: 12px; }
  #status.connected { color: var(--ok); } #status.error, #status.reconnecting { color: var(--bad); }
  dl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 16px; }
  dl div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  dt { color: var(--muted); font-size: 13px; } dd { margin: 0; font-size: 22px; font-variant-numeric: tabular-nums; }
  pre { white-space: pre-wrap; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; min-height: 1em; }
</style>
</head>
<body>
<main>
  <h1>Probe connection test</h1>
  <p>Enter the probe IP from Serial Monitor (or <code>localhost:8081</code> for the mock probe).</p>
  <form id="f"><input id="ip" placeholder="172.20.10.2" autocomplete="off"><button>Connect</button></form>
  <div id="status">idle</div>
  <dl>
    <div><dt>Temperature, °C</dt><dd id="temp">—</dd></div>
    <div><dt>pH</dt><dd id="ph">—</dd></div>
    <div><dt>Salinity (TDS), ppm</dt><dd id="tds">—</dd></div>
    <div><dt>Moisture, %</dt><dd id="moist">—</dd></div>
  </dl>
  <button id="snap" type="button" disabled>Take 5 s snapshot</button>
  <pre id="out"></pre>
</main>
<script type="module">
  import { SoilDevice } from "./soil-device.js";
  let probe = null;
  const $ = (id) => document.getElementById(id);
  $("f").onsubmit = (e) => {
    e.preventDefault();
    if (probe) probe.close();
    probe = new SoilDevice($("ip").value || "localhost:8081");
    probe.onStatus = (s) => { $("status").textContent = s; $("status").className = s; $("snap").disabled = s !== "connected"; };
    probe.onReading = (r) => { for (const k of ["temp", "ph", "tds", "moist"]) $(k).textContent = r[k]; };
    probe.connect();
  };
  $("snap").onclick = async () => {
    $("out").textContent = "collecting 5 s…";
    try { $("out").textContent = JSON.stringify(await probe.snapshot(5), null, 2); }
    catch (err) { $("out").textContent = String(err); }
  };
</script>
</body>
</html>
